{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-5">
    <div>
        <h1 class="page-title">Словарь HSK</h1>
        <p class="page-subtitle">HSK 1–3 · {{ hsk_count|default:"2 226" }} слов</p>
    </div>
</div>

<!-- Search -->
<div class="card mb-4" style="max-width:720px;">
    <div class="card-body" style="padding:20px;">
        <div class="position-relative">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"
                 style="position:absolute; left:14px; top:50%; transform:translateY(-50%); pointer-events:none;">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-input" class="form-control"
                   placeholder="Пиньинь или перевод на русском..."
                   style="padding-left:42px; padding-right:42px; height:48px; font-size:0.95rem;">
            <div id="search-clear" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; display:none; color:var(--text-muted);" onclick="clearSearch()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
        </div>
        <p style="font-size:0.75rem; color:var(--text-muted); margin-top:10px; margin-bottom:0;">
            Введите минимум 2 символа для поиска
        </p>
    </div>
</div>

<!-- Results -->
<div id="search-results" style="max-width:720px;">

    <!-- Empty state -->
    <div id="empty-state" style="text-align:center; padding:48px 24px; color:var(--text-muted);">
        <div style="font-family:'Noto Serif SC',serif; font-size:3rem; color:var(--paper-border); margin-bottom:12px;">搜</div>
        <p style="font-size:0.9rem;">Начните вводить слово для поиска</p>
    </div>

    <!-- Table -->
    <div id="results-table-wrap" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <span id="results-count" style="font-size:0.78rem; color:var(--text-muted);"></span>
        </div>
        <!-- table-responsive обеспечивает горизонтальный скролл на мобильных -->
        <div class="table-responsive" style="border:1px solid var(--paper-border); border-radius:var(--radius-lg);">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th style="width:72px;">Слово</th>
                        <th class="d-none d-sm-table-cell">Пиньинь</th>
                        <th>Перевод</th>
                        <th style="width:80px;">Уровень</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <!-- No results -->
    <div id="no-results" style="display:none; text-align:center; padding:48px 24px;">
        <div style="font-size:2rem; margin-bottom:12px;">🔍</div>
        <p style="color:var(--text-muted); font-size:0.9rem;">Ничего не найдено. Попробуйте другой запрос.</p>
    </div>

</div>

<script>
    const searchInput = document.getElementById('search-input');
    const resultsTableWrap = document.getElementById('results-table-wrap');
    const resultsBody = document.getElementById('results-body');
    const noResults = document.getElementById('no-results');
    const emptyState = document.getElementById('empty-state');
    const searchClear = document.getElementById('search-clear');
    const resultsCount = document.getElementById('results-count');

    let searchTimeout;

    function clearSearch() {
        searchInput.value = '';
        searchClear.style.display = 'none';
        resultsTableWrap.style.display = 'none';
        noResults.style.display = 'none';
        emptyState.style.display = '';
        resultsBody.innerHTML = '';
    }

    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim();
        searchClear.style.display = q ? 'block' : 'none';

        clearTimeout(searchTimeout);
        if (q.length < 2) {
            resultsTableWrap.style.display = 'none';
            noResults.style.display = 'none';
            emptyState.style.display = '';
            return;
        }

        searchTimeout = setTimeout(() => doSearch(q), 250);
    });

    // Определяем, является ли текущий экран мобильным
    function isMobile() {
        return window.innerWidth < 576;
    }

    async function doSearch(query) {
        try {
            const resp = await fetch("{% url 'dictionary_search' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ query })
            });
            if (!resp.ok) return;
            const results = await resp.json();

            resultsBody.innerHTML = '';
            emptyState.style.display = 'none';

            if (results.length > 0) {
                resultsTableWrap.style.display = '';
                noResults.style.display = 'none';
                resultsCount.textContent = `Найдено: ${results.length}`;

                results.forEach(r => {
                    const tr = document.createElement('tr');
                    // Пиньинь скрыт на очень маленьких экранах через Bootstrap-класс
                    tr.innerHTML = `
                        <td style="font-family:'Noto Serif SC',serif; font-size:1.6rem; color:var(--ink); padding:10px 16px; white-space:nowrap;">${r.character}</td>
                        <td class="d-none d-sm-table-cell" style="color:var(--text-muted); font-size:0.875rem; white-space:nowrap;">${r.pinyin}</td>
                        <td style="font-size:0.875rem;">${r.meaning}</td>
                        <td style="white-space:nowrap;"><span class="badge bg-secondary">${r.category}</span></td>
                    `;
                    resultsBody.appendChild(tr);
                });
            } else {
                resultsTableWrap.style.display = 'none';
                noResults.style.display = 'block';
            }
        } catch(e) {
            console.error(e);
        }
    }
</script>
{% endblock %}
