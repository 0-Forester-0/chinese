{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="row justify-content-center mt-4">
<div class="col-12 col-sm-9 col-md-6 col-lg-5">

    <!-- Brand mark -->
    <div class="text-center mb-5">
        <span style="font-family:'Noto Serif SC',serif; font-size:3rem; color:var(--vermillion); display:block; line-height:1; margin-bottom:8px;">汉</span>
        <h1 style="font-size:1.4rem; font-weight:700; color:var(--ink);">Chinese SRS</h1>
        <p style="font-size:0.85rem; color:var(--text-muted);">Войдите, чтобы продолжить обучение</p>
    </div>

    <div class="card">
        <div class="card-body" style="padding:32px;">
            <h2 style="font-size:1.1rem; font-weight:600; margin-bottom:24px;">Вход в аккаунт</h2>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Имя пользователя</label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Пароль</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100" style="padding:12px;">
                    Войти
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </button>
            </form>

            <p style="text-align:center; font-size:0.82rem; color:var(--text-muted); margin-top:20px; margin-bottom:0;">
                Нет аккаунта?
                <a href="{% url 'register' %}" style="color:var(--ink); font-weight:600; text-decoration:none;">
                    Зарегистрируйтесь →
                </a>
            </p>
        </div>
    </div>

</div>
</div>

<style>
    .form-control, .form-select {
        padding: 10px 14px;
    }
</style>
{% endblock %}
