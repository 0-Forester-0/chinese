{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
<div class="col-12 col-md-8 col-lg-6">

    <div class="mb-5">
        <h1 class="page-title">Настройка теста</h1>
        <p class="page-subtitle">Выберите уровень и количество иероглифов</p>
    </div>

    <!-- Выбор уровня -->
    <div class="card mb-3">
        <div class="card-body" style="padding:24px;">
            <label class="form-label mb-3">Уровень HSK</label>
            <div class="d-flex flex-column gap-2" id="category-list">
                {% for category in categories %}
                <label style="cursor:pointer;">
                    <input type="radio" name="category" value="{{ category }}"
                           class="d-none cat-radio" {% if forloop.first %}checked{% endif %}>
                    <div class="category-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="category-icon">
                                {% if category == 'HSK1' %}🌱
                                {% elif category == 'HSK2' %}🌿
                                {% else %}🌳{% endif %}
                            </div>
                            <div>
                                <div style="font-size:1rem; font-weight:600; color:var(--ink);">{{ category }}</div>
                                <div style="font-size:0.78rem; color:var(--text-muted);">
                                    {% if category == 'HSK1' %}Базовый · 
                                    {% elif category == 'HSK2' %}Элементарный ·
                                    {% else %}Средний ·{% endif %}
                                </div>
                            </div>
                        </div>
                        <div class="check-mark">✓</div>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Выбор количества -->
    <div class="card mb-4">
        <div class="card-body" style="padding:24px;">
            <label class="form-label mb-3">Количество иероглифов</label>
            <div class="d-flex gap-3 flex-wrap" id="count-list">
                {% for n in count_options %}
                <label style="cursor:pointer; flex:1; min-width:80px;">
                    <input type="radio" name="count" value="{{ n }}"
                           class="d-none count-radio" {% if n == 20 %}checked{% endif %}>
                    <div class="count-card">
                        <div style="font-size:1.8rem; font-weight:700; color:var(--ink); line-height:1;">{{ n }}</div>
                        <div style="font-size:0.72rem; color:var(--text-muted); margin-top:4px;">
                            {% if n == 10 %}~2 мин
                            {% elif n == 20 %}~4 мин
                            {% else %}~6 мин{% endif %}
                        </div>
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Кнопка старт -->
    <button id="btn-start" class="btn btn-primary btn-lg w-100" style="padding:14px;">
        Начать тест
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ms-2">
            <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
    </button>

    <div class="mt-3">
        <a href="{% url 'home' %}" class="btn btn-secondary">← Назад</a>
    </div>

</div>
</div>

<style>
    .category-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: var(--surface);
        border: 1.5px solid var(--paper-border);
        border-radius: var(--radius-md);
        transition: all var(--transition);
    }
    .category-card:hover { border-color: var(--ink-soft); background: var(--paper-warm); }
    .cat-radio:checked + .category-card {
        border-color: var(--ink);
        background: var(--paper-warm);
        box-shadow: 0 0 0 3px rgba(14,27,46,0.08);
    }
    .check-mark {
        width: 24px; height: 24px;
        border-radius: 50%;
        background: var(--paper-border);
        color: transparent;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.8rem; font-weight: 700;
        transition: all var(--transition);
    }
    .cat-radio:checked + .category-card .check-mark {
        background: var(--ink);
        color: #fff;
    }

    .count-card {
        text-align: center;
        padding: 20px 12px;
        background: var(--surface);
        border: 1.5px solid var(--paper-border);
        border-radius: var(--radius-md);
        transition: all var(--transition);
    }
    .count-card:hover { border-color: var(--ink-soft); background: var(--paper-warm); }
    .count-radio:checked + .count-card {
        border-color: var(--ink);
        background: var(--ink);
    }
    .count-radio:checked + .count-card div { color: #fff !important; }

    .category-icon {
        font-size: 1.4rem;
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        background: var(--paper-warm);
        border-radius: var(--radius-sm);
    }
</style>

<script>
    document.getElementById('btn-start').addEventListener('click', () => {
        const category = document.querySelector('.cat-radio:checked')?.value;
        const count    = document.querySelector('.count-radio:checked')?.value;
        if (category && count) {
            window.location.href = `/game/${category}/${count}/`;
        }
    });
</script>
{% endblock %}
